name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang platform dan build-tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          PLATFORM="$ANDROID_HOME/platforms/android-35/android.jar"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          mkdir -p build/gen build/classes

          "$TOOLS/aapt2" compile --dir res -o build/res.zip
          "$TOOLS/aapt2" link --min-sdk-version 26 --target-sdk-version 35 -I "$PLATFORM" \
            --manifest AndroidManifest.xml --java build/gen -A assets \
            -o build/unaligned.apk build/res.zip

          javac -source 17 -target 17 -cp "$PLATFORM" -d build/classes \
            $(find build/gen src -name "*.java")
          "$TOOLS/d8" --lib "$PLATFORM" --output build $(find build/classes -name "*.class")
          (cd build && zip -q unaligned.apk classes.dex)

          "$TOOLS/zipalign" -f -p 4 build/unaligned.apk build/aligned.apk
          keytool -genkeypair -keystore debug.keystore -storepass android -keypass android \
            -alias debug -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug"
          "$TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android \
            --out build/app-debug.apk build/aligned.apk

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app-debug.apk
